
name: BuilRafiq Student APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: |
          flutter create --platforms=android --project-name rafiq_student /tmp/rafiq_app
          cp -r /tmp/rafiq_app/android ./android
          cp /tmp/rafiq_app/analysis_options.yaml ./analysis_options.yaml
      - name: Get dependencies
        run: flutter pub get

      - name: Check code
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: rafiq-student-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
